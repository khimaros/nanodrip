[package]
name = "nanodrip-firmware"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "nanodrip-firmware"
harness = false

[dependencies]
anyhow = "1"
bstr = "1"
esp-idf-svc = "0.53"
esp32-nimble = "0.13"
log = "0.4"
nanodrip-app = { path = "../crates/nanodrip-app" }
nanodrip-core = { path = "../crates/nanodrip-core" }
rand_core = { version = "0.6", features = ["getrandom"] }

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"

[workspace]
